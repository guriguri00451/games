<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>クリックチャレンジ</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #1e1b4b; color: #fff; font-family: system-ui, sans-serif; text-align: center; }
  button { font-size: 1.5rem; padding: 24px 48px; border: 0; border-radius: 16px; background: #818cf8; color: #fff; cursor: pointer; }
  p { font-size: 1.2rem; }
</style>
</head>
<body>
<main>
  <p>残り <span id="time">10</span> 秒 / スコア <span id="score">0</span></p>
  <button id="btn" type="button">クリックして開始</button>
</main>
<script>
  const GAME_SECONDS = 10;
  const btn = document.getElementById("btn");
  const timeEl = document.getElementById("time");
  const scoreEl = document.getElementById("score");
  let score = 0, remaining = GAME_SECONDS, timerId = null;

  btn.addEventListener("click", () => {
    if (timerId === null) {
      score = 0; remaining = GAME_SECONDS;
      timerId = setInterval(() => {
        remaining -= 1;
        timeEl.textContent = remaining;
        if (remaining <= 0) {
          clearInterval(timerId); timerId = null;
          btn.textContent = `終了！ ${score}回 (もう一度)`;
        }
      }, 1000);
    }
    if (timerId !== null) { score += 1; scoreEl.textContent = score; btn.textContent = "クリック！"; }
    timeEl.textContent = remaining;
  });
</script>
</body>
</html>
