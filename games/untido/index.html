<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="description" content="円を描いて、一巻き。師範が銘を付ける。">
<title>うんち道</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Mai&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: 稽古は半紙を真上から見て中央に描く。離すと半紙が消え、床の間の盆に載った立体へ視点が降りる。結果は掛け軸一幅 */
  --sumi:#1b1815;      /* 墨 */
  --kinari:#ebe3d0;    /* 生成り */
  --kabe:#bdb394;      /* 聚楽壁 */
  --ai:#2c3945;        /* 表装の藍鼠 */
  --shu:#b23a2b;       /* 朱（落款と主ボタンだけ） */
  --kin:#a58a4a;       /* 一文字の金 */
  --display:"Yuji Mai","Yuji Syuku","Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP","Noto Serif JP",serif;
  --body:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP","Noto Serif JP",serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--sumi);color:var(--kinari);overflow:hidden;
  font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas.layer{position:fixed;inset:0;width:100%;height:100%;display:block}
#gl{touch-action:none;cursor:crosshair}
#hud{position:fixed;top:10px;right:12px;display:flex;gap:10px;align-items:center;
  font:500 13px var(--body);letter-spacing:.12em;color:var(--kinari);transition:color .6s}
body.room #hud{color:var(--sumi)}
button,.btn{font:500 16px var(--body);letter-spacing:.14em;color:var(--kinari);background:transparent;
  border:1px solid rgba(235,227,208,.45);border-radius:2px;padding:10px 18px;cursor:pointer;text-decoration:none;
  display:inline-block;line-height:1.2}
button:hover,.btn:hover{border-color:var(--kinari)}
:focus-visible{outline:2px solid var(--kinari);outline-offset:3px}
#snd{padding:4px 9px;font-size:13px;color:inherit;border-color:currentColor}
body.room #snd:focus-visible{outline-color:var(--sumi)}
#snd[aria-pressed="false"]{text-decoration:line-through;opacity:.55}
#result{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding:16px;box-sizing:border-box;background:rgba(14,12,11,.88);opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .5s, visibility 0s .5s}
#result.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .5s}
#scroll{display:block;min-height:0;max-width:100%;max-height:calc(100% - 128px);aspect-ratio:720/1280;
  box-shadow:0 10px 40px rgba(0,0,0,.6);touch-action:none;cursor:grab}
#promo{margin:0;min-height:1.3em;font:500 14px var(--body);letter-spacing:.2em;color:var(--kin)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.row button,.row .btn{font-size:15px;letter-spacing:.08em;padding:10px 13px}
#again{background:var(--shu);border-color:var(--shu)}
#nogl{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;
  background:var(--sumi);font:500 15px/1.9 var(--body)}
@media (prefers-reduced-motion:reduce){#result{transition:none}}
</style>
</head>
<body>
<canvas id="stage" class="layer"></canvas>
<canvas id="paper" class="layer"></canvas>
<canvas id="gl" class="layer" role="img" aria-label="うんち道。半紙の中央に円を描くと一巻きずつ積み上がる。離すと盆の上の立体になる。"></canvas>
<div id="hud"><span id="rank"></span><button id="snd" type="button" aria-pressed="true" aria-label="音の入切">音</button></div>
<div id="result" aria-live="polite">
  <canvas id="scroll" role="img"></canvas>
  <p id="promo"></p>
  <div class="row">
    <button id="again" type="button">もう一巻き</button>
    <button id="save" type="button">画像を保存</button>
    <a id="tweet" class="btn" target="_blank" rel="noopener">Xに投稿</a>
  </div>
</div>
<div id="nogl">この端末では立体を描けませんでした。<br>別のブラウザで開いてください。</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const st = $('stage'), g = st.getContext('2d');
const pc = $('paper'), pg = pc.getContext('2d');
const glc = $('gl');
const bg = document.createElement('canvas'), paperBg = document.createElement('canvas');
const scrollCv = $('scroll'), scrollBg = document.createElement('canvas'), scrollFg = document.createElement('canvas');
const DISPLAY = '"Yuji Mai","Yuji Syuku","Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP","Noto Serif JP",serif';
const BODY = '"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP","Noto Serif JP",serif';
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = u => u * u * (3 - 2 * u);
const TAU = Math.PI * 2;

// ---- 定数（世界の単位は盆の半径≒1） ----
const PHI = 28 * Math.PI / 180;
const TRAY_R = 1.12, RCLAMP = 1.55, DS = 0.035;
const Q = 0.46;                        // 出る量（体積/秒）
const TMIN = 0.105, TMAX = 0.44;
const VPOOL = Q / (Math.PI * TMAX * TMAX);
const VMAX = Q * 13;                   // 一回分

let W = 0, H = 0, DPR = 1;
const L = {};

// ---- 状態 ----
let P = [], sLen = 0, tailFrom = -1;
let state = 'idle';
let cur = { x: 0, z: 0, px: 0, py: 0 }, moveQ = [], started = false, holdT = 0, downPx = null, pid = null;
let vS = 2, vL = 2, tCur = 0.25, carry = 0, vol = 0, pooled = 0;
let angSum = 0, lastAng = null, vSum = 0, vSq = 0, vN = 0;
let stab = { ratio: 0, maxY: 0 }, sinceCheck = 0, ext = 0, flick = 0;
let fall = null, showT = 0, rot = 0, shake = 0, time = 0, J = null, samples = [];
let viewK = 0;                          // 0: 真上（半紙）　1: 床の間（立体）
let aR = 0, aCx = 0, aCz = 0, aLoop = false;   // 手添え（丸く描く補助）
let sYaw = 0, sPhi = PHI, sVel = 0, sDrag = null, scrollDirty = false, shareBlob = null, blobTimer = 0, flashTimer = 0;
const SHARE_URL = '';   // 公開先が決まったらURLを入れる
let isRoom = false, stageDirty = true, tubeDirty = false, tubeFull = false, blobIdx = [];
let save = loadSave();

// ---- 立体 ----
const RS = 16, MAXR = 3600;
const COS = [], SIN = [];
for (let k = 0; k < RS; k++) { COS.push(Math.cos(k / RS * TAU)); SIN.push(Math.sin(k / RS * TAU)); }
const posA = new Float32Array(MAXR * RS * 3), norA = new Float32Array(MAXR * RS * 3);
const Qx = new Float32Array(MAXR), Qy = new Float32Array(MAXR), Qz = new Float32Array(MAXR), Rr = new Float32Array(MAXR);
const Nx = new Float32Array(MAXR), Ny = new Float32Array(MAXR), Nz = new Float32Array(MAXR);
let renderer = null, scene, cam, group, tubeGeo, mat, trayMats = [], catchPaper, catchFloor, sphereGeo, blobMeshes = [], builtN = 0;

function init3D() {
  renderer = new THREE.WebGLRenderer({ canvas: glc, antialias: true, alpha: true });
  renderer.setClearColor(0x000000, 0);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  scene = new THREE.Scene();
  cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100);
  // 映り込み（障子越しの明かり）
  const ec = document.createElement('canvas'); ec.width = 256; ec.height = 128;
  const e = ec.getContext('2d'), eg = e.createLinearGradient(0, 0, 0, 128);
  eg.addColorStop(0, '#8d8372'); eg.addColorStop(0.22, '#4a4239'); eg.addColorStop(0.5, '#231e19'); eg.addColorStop(1, '#0c0907');
  e.fillStyle = eg; e.fillRect(0, 0, 256, 128);
  e.fillStyle = '#ffffff'; e.fillRect(40, 6, 52, 20); e.fillStyle = '#e8cfa8'; e.fillRect(172, 14, 36, 14);
  const et = new THREE.CanvasTexture(ec); et.mapping = THREE.EquirectangularReflectionMapping; et.encoding = THREE.sRGBEncoding;
  const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromEquirectangular(et).texture; et.dispose(); pm.dispose();
  scene.add(new THREE.HemisphereLight(0xfff1dc, 0x3a2a1c, 0.42));
  const light = new THREE.DirectionalLight(0xfff2de, 1.1); light.position.set(-3.2, 6.5, 3.6); light.castShadow = true;
  light.shadow.mapSize.set(1024, 1024);
  const sc = light.shadow.camera; sc.left = -2.8; sc.right = 2.8; sc.top = 2.8; sc.bottom = -2.8; sc.near = 1; sc.far = 18;
  light.shadow.bias = -0.0008; light.shadow.normalBias = 0.025; light.shadow.radius = 3;
  scene.add(light);

  mat = new THREE.MeshPhysicalMaterial({ color: 0x6b3610, roughness: 0.4, metalness: 0, clearcoat: 0.85, clearcoatRoughness: 0.2, envMapIntensity: 0.65 });
  group = new THREE.Group(); scene.add(group);
  tubeGeo = new THREE.BufferGeometry();
  const pa = new THREE.BufferAttribute(posA, 3), na = new THREE.BufferAttribute(norA, 3);
  pa.setUsage(THREE.DynamicDrawUsage); na.setUsage(THREE.DynamicDrawUsage);
  tubeGeo.setAttribute('position', pa); tubeGeo.setAttribute('normal', na);
  const idx = new Uint16Array((MAXR - 1) * RS * 6); let o = 0;
  for (let i = 0; i < MAXR - 1; i++) for (let k = 0; k < RS; k++) {
    const a = i * RS + k, b = i * RS + (k + 1) % RS, c = a + RS, d = b + RS;
    idx[o++] = a; idx[o++] = b; idx[o++] = c; idx[o++] = b; idx[o++] = d; idx[o++] = c;
  }
  tubeGeo.setIndex(new THREE.BufferAttribute(idx, 1)); tubeGeo.setDrawRange(0, 0);
  const tube = new THREE.Mesh(tubeGeo, mat); tube.castShadow = tube.receiveShadow = true; tube.frustumCulled = false; group.add(tube);
  sphereGeo = new THREE.SphereGeometry(1, 32, 20);
  // 漆の盆
  const lac = new THREE.MeshPhysicalMaterial({ color: 0x070605, roughness: 0.36, clearcoat: 1, clearcoatRoughness: 0.14, transparent: true, envMapIntensity: 0.55 });
  const rimM = new THREE.MeshStandardMaterial({ color: 0x6a1d13, roughness: 0.6, transparent: true, envMapIntensity: 0.25 });
  trayMats = [lac, rimM];
  const body = new THREE.Mesh(new THREE.CylinderGeometry(TRAY_R, TRAY_R * 0.96, 0.07, 72), lac);
  body.position.y = -0.035; body.receiveShadow = true; body.castShadow = true; scene.add(body);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(TRAY_R - 0.014, 0.014, 8, 120), rimM);
  rim.rotation.x = Math.PI / 2; rim.position.y = 0.002; scene.add(rim);
  trayMats.meshes = [body, rim];
  // 影受け（半紙の上／床板の上）
  catchPaper = new THREE.Mesh(new THREE.PlaneGeometry(14, 14), new THREE.ShadowMaterial({ opacity: 0.22, depthWrite: false }));
  catchPaper.rotation.x = -Math.PI / 2; catchPaper.receiveShadow = true; scene.add(catchPaper);
  catchFloor = new THREE.Mesh(new THREE.PlaneGeometry(14, 14), new THREE.ShadowMaterial({ opacity: 0.45, depthWrite: false }));
  catchFloor.rotation.x = -Math.PI / 2; catchFloor.position.y = -0.07; catchFloor.receiveShadow = true; scene.add(catchFloor);
}
function applyCamera(phi, cx, cy, S) {
  cam.left = -cx / S; cam.right = (W - cx) / S; cam.top = cy / S; cam.bottom = -(H - cy) / S;
  cam.position.set(0, Math.sin(phi) * 30, Math.cos(phi) * 30); cam.rotation.set(-phi, 0, 0);
  cam.updateProjectionMatrix();
}
function setStage(e) {   // e: 0 半紙 → 1 床の間
  for (const m of trayMats) m.opacity = clamp((e - 0.1) / 0.6, 0, 1);
  for (const m of trayMats.meshes) m.visible = e > 0.1;
  catchPaper.material.opacity = 0.22 * (1 - e); catchPaper.visible = e < 0.99;
  catchFloor.material.opacity = 0.45 * e; catchFloor.visible = e > 0.01;
}
function buildTube(full) {
  const n = Math.min(P.length, MAXR);
  if (n < 2) { tubeGeo.setDrawRange(0, 0); builtN = n; return; }
  const from = full ? 0 : Math.max(0, builtN - 12), q0 = Math.max(0, from - 1), live = tailFrom < 0;
  for (let i = q0; i < n; i++) {
    let sx = 0, sy = 0, sz = 0, sr = 0, sw = 0, hy = 0, hw = 0;
    for (let d = -2; d <= 2; d++) {
      const j = i + d; if (j < 0 || j >= n) continue;
      const w = 3 - Math.abs(d), p = P[j];
      sx += w * p.x; sz += w * p.z; sr += w * Math.min(p.t, TMAX); sw += w;
    }
    for (let d = -6; d <= 6; d++) {
      const j = i + d; if (j < 0 || j >= n) continue;
      const w = 7 - Math.abs(d); hy += w * P[j].y; hw += w;
    }
    Qx[i] = sx / sw; Qy[i] = hy / hw; Qz[i] = sz / sw;
    let r = sr / sw; const j = n - 1 - i;
    if (i < 4) r *= Math.sqrt(1 - (1 - i / 4) ** 2);
    if (live) { if (j < 3) r *= Math.sqrt(1 - (1 - j / 3) ** 2); } else if (j === 0) r = 0;
    Rr[i] = r;
  }
  for (let i = from; i < n; i++) {
    const a = Math.max(0, i - 1), b = Math.min(n - 1, i + 1);
    let tx = Qx[b] - Qx[a], ty = Qy[b] - Qy[a], tz = Qz[b] - Qz[a];
    const seg = Math.hypot(tx, ty, tz);
    if (seg < 1e-6) { tx = 1; ty = 0; tz = 0; } else { tx /= seg; ty /= seg; tz /= seg; }
    let nx = 0, ny = 1, nz = 0;
    if (i > 0) { nx = Nx[i - 1]; ny = Ny[i - 1]; nz = Nz[i - 1]; }
    const d = nx * tx + ny * ty + nz * tz; nx -= d * tx; ny -= d * ty; nz -= d * tz;
    let l = Math.hypot(nx, ny, nz);
    if (l < 1e-4) {
      if (Math.abs(ty) < 0.9) { nx = -tx * ty; ny = 1 - ty * ty; nz = -tz * ty; } else { nx = 1 - tx * tx; ny = -ty * tx; nz = -tz * tx; }
      l = Math.hypot(nx, ny, nz);
    }
    nx /= l; ny /= l; nz /= l; Nx[i] = nx; Ny[i] = ny; Nz[i] = nz;
    const bx = ty * nz - tz * ny, by = tz * nx - tx * nz, bz = tx * ny - ty * nx;
    const r = Rr[i], slope = seg > 1e-5 ? (Rr[b] - Rr[a]) / seg : 0;
    let o = i * RS * 3;
    for (let k = 0; k < RS; k++) {
      const c = COS[k], s = SIN[k], dx = c * nx + s * bx, dy = c * ny + s * by, dz = c * nz + s * bz;
      posA[o] = Qx[i] + dx * r; posA[o + 1] = Qy[i] + dy * r; posA[o + 2] = Qz[i] + dz * r;
      const mx = dx - tx * slope, my = dy - ty * slope, mz = dz - tz * slope, ml = Math.hypot(mx, my, mz) || 1;
      norA[o] = mx / ml; norA[o + 1] = my / ml; norA[o + 2] = mz / ml; o += 3;
    }
  }

  pa.updateRange.offset = na.updateRange.offset = from * RS * 3;
  pa.updateRange.count = na.updateRange.count = (n - from) * RS * 3;
  pa.needsUpdate = na.needsUpdate = true;
  tubeGeo.setDrawRange(0, (n - 1) * RS * 6); builtN = n;
}
function syncBlobs() {
  for (let i = 0; i < blobIdx.length; i++) {
    let m = blobMeshes[i];
    if (!m) { m = new THREE.Mesh(sphereGeo, mat); m.castShadow = m.receiveShadow = true; group.add(m); blobMeshes[i] = m; }
    const p = P[blobIdx[i]]; m.visible = true; m.position.set(p.x, p.y, p.z); m.scale.setScalar(p.t);
  }
  for (let i = blobIdx.length; i < blobMeshes.length; i++) blobMeshes[i].visible = false;
}

// ---- 配置 ----
function layout() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  for (const c of [st, pc]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }
  if (renderer) { renderer.setPixelRatio(DPR); renderer.setSize(W, H, false); }
  L.cx = W / 2; L.cw = Math.min(W, H * 0.62);
  L.horizon = H * 0.48; L.trayY = H * 0.69; L.S = Math.min(L.cw * 0.33, H * 0.16);
  const pw = Math.min(W - 16, H * 0.62, 640), ph = Math.min(H - 96, pw * 1.6);
  L.paper = { x: (W - pw) / 2, y: (H - ph) / 2 + 14, w: pw, h: ph };
  L.Sd = pw / 2.3; L.dy = L.paper.y + ph / 2;
  buildStatic(); buildPaper(); stageDirty = true;
}
function speckle(c, x, y, w, h, n, rgb) {
  for (let i = 0; i < n; i++) {
    c.fillStyle = `rgba(${rgb},${0.02 + Math.random() * 0.05})`;
    c.fillRect(x + Math.random() * w, y + Math.random() * h, 1 + Math.random() * 1.6, 1 + Math.random() * 1.6);
  }
}
function vtext(c, str, x, y, size, family, weight, lead) {
  c.font = `${weight || 500} ${size}px ${family || BODY}`;
  c.textAlign = 'center'; c.textBaseline = 'middle';
  const ld = lead || 1.08; let yy = y + size / 2;
  for (const ch of str) {
    if (ch === '。' || ch === '、') { c.fillText(ch, x + size * 0.62, yy - size * 0.6); yy += size * 0.45; continue; }
    if (ch === '　') { yy += size * 0.6; continue; }
    c.fillText(ch, x, yy); yy += size * ld;
  }
  return yy - size / 2;
}
// 筆で書いた字：一字ごとに傾きと大きさが揺れ、掠れが入る
function brushText(c, str, x, y, size, color, seed) {

  const t = document.createElement('canvas'); t.width = w * 2; t.height = h * 2;
  const k = t.getContext('2d'); k.scale(2, 2);
  let s = (seed || 7) % 2147483647; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  k.fillStyle = color; k.textAlign = 'center'; k.textBaseline = 'middle'; k.font = `400 ${size}px ${DISPLAY}`;
  let yy = pad + size / 2;
  for (const ch of str) {
    k.save(); k.translate(w / 2 + (rnd() - 0.5) * size * 0.09, yy); k.rotate((rnd() - 0.5) * 0.10);
    const sc = 1 + (rnd() - 0.5) * 0.12; k.scale(sc, sc); k.fillText(ch, 0, 0); k.restore();
    yy += size * 1.04;

  const ns = Math.round(str.length * size * 0.9);

    const px = rnd() * w, py = rnd() * h, len = size * (0.05 + rnd() * 0.24), a = -1.05 + (rnd() - 0.5) * 0.5;
    k.globalAlpha = 0.16 + rnd() * 0.36; k.lineWidth = (0.5 + rnd() * 1.1) * Math.max(0.6, size / 60);

}
function buildStatic() {
  bg.width = st.width; bg.height = st.height;
  const b = bg.getContext('2d'); b.setTransform(DPR, 0, 0, DPR, 0, 0);
  // 壁
  let gr = b.createLinearGradient(0, 0, 0, L.horizon);
  gr.addColorStop(0, '#b0a685'); gr.addColorStop(1, '#c3b99a');
  b.fillStyle = gr; b.fillRect(0, 0, W, L.horizon + 2);

  // 題の掛け軸
  const sw = clamp(L.cw * 0.2, 60, 130), sh = Math.min(L.horizon * 0.8, sw * 3.6);
  const sx = Math.max(10, L.cx - L.cw * 0.3 - sw / 2), sy = L.horizon * 0.09;

  b.beginPath(); b.moveTo(sx + sw * 0.25, sy); b.lineTo(sx + sw / 2, sy - L.horizon * 0.05); b.lineTo(sx + sw * 0.75, sy); b.stroke();

  const pm = sw * 0.14, py0 = sy + sh * 0.14, phh = sh * 0.70;
  b.fillStyle = '#a58a4a'; b.fillRect(sx + pm, py0 - sh * 0.022, sw - pm * 2, sh * 0.022); b.fillRect(sx + pm, py0 + phh, sw - pm * 2, sh * 0.022);
  b.fillStyle = '#ece5d3'; b.fillRect(sx + pm, py0, sw - pm * 2, phh);
  b.fillStyle = '#2a1c12'; b.fillRect(sx - 4, sy + sh - 3, sw + 8, 6); b.fillRect(sx - 2, sy - 2, sw + 4, 3);
  const ts = Math.min((sw - pm * 2) * 0.78, phh / 4.5);

    const buf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate), d = buf.getChannelData(0);

    rubGain = AC.createGain(); rubGain.gain.value = 0;
